version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - nilnesserr
    - bodyclose
    - durationcheck
    - errorlint
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - "(_test|_generated)\\.go$"
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - errcheck
      - linters:
          - govet
        text: "fieldalignment:"
