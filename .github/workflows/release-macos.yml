name: Release macOS Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          case "$VERSION" in
            v*) ;;
            *) echo "VERSION must start with v: $VERSION"; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build macOS application
        run: wails build -platform darwin/arm64 -clean

      - name: Package application
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/mux.app "dist/mux-${VERSION}-darwin-arm64.zip"
          shasum -a 256 "dist/mux-${VERSION}-darwin-arm64.zip" > "dist/mux-${VERSION}-darwin-arm64.zip.sha256"
          mkdir -p dist/dmg-root
          cp -R build/bin/mux.app dist/dmg-root/Mux.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Mux ${VERSION}" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/mux-${VERSION}-darwin-arm64.dmg"
          shasum -a 256 "dist/mux-${VERSION}-darwin-arm64.dmg" > "dist/mux-${VERSION}-darwin-arm64.dmg.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Mux ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/mux-${{ env.VERSION }}-darwin-arm64.zip
            dist/mux-${{ env.VERSION }}-darwin-arm64.zip.sha256
            dist/mux-${{ env.VERSION }}-darwin-arm64.dmg
            dist/mux-${{ env.VERSION }}-darwin-arm64.dmg.sha256
